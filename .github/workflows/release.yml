name: Release (npm)

# Publica no npm quando uma tag vX.Y.Z é enviada a partir de um commit da main.
# Autenticação via Trusted Publishing (OIDC) — sem token no repositório.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # criar a GitHub Release
  id-token: write   # OIDC para npm (trusted publishing + provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag precisa estar na main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::A tag $GITHUB_REF_NAME não aponta para um commit da main."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: npm com suporte a trusted publishing
        run: npm install -g npm@latest

      - name: Versão do package.json = tag
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package.json ($PKG) diferente da tag ($GITHUB_REF_NAME)."
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run lint:skill
      - run: npm publish --access public --provenance

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
